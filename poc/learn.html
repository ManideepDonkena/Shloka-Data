<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn a Shloka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:ital,wght@0,600;1,400&family=Noto+Serif+Devanagari:wght@500;700&display=swap">
<style>
:root{--paper:#faf8f1;--card:#fffdf6;--cream:#f3ecd9;--ink:#183b45;--muted:#61767a;--gold:#f6b73c;--teal:#2aa591;--line:rgba(24,59,69,.13);--warn:#e08a5a;--shadow:0 8px 24px rgba(3,16,24,.07)}
@media (prefers-color-scheme:dark){:root{--paper:#0d2734;--card:#12303c;--cream:#163b47;--ink:#f3ecd9;--muted:#9bb2b4;--line:rgba(255,255,255,.15);--teal:#37c7b3;--shadow:0 8px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:var(--ink)}button{cursor:pointer}a{color:var(--teal)}:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.bar1 select{flex:1;min-width:0;text-align:center;font-weight:600}
select{padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--cream)}
.ic{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-size:1.1rem}.ic:disabled{opacity:.3;cursor:default}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;margin-bottom:10px;background:var(--cream);border-radius:14px}
.seg button{border:0;background:transparent;border-radius:11px;padding:6px 2px;line-height:1.2;font-size:.92rem}
.seg button[aria-pressed=true]{background:var(--gold);color:#183b45;font-weight:600}
main{padding:14px 16px 190px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.meta .ref{font:600 1.05rem Fraunces,Georgia,serif}
.chip{border:1px solid var(--line);background:var(--cream);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip.on{background:var(--gold);border-color:var(--gold);color:#183b45;font-weight:600}
.block{background:var(--card);border:2px solid transparent;border-radius:20px;padding:10px 6px;box-shadow:var(--shadow)}
.block.sel{border-color:var(--gold)}
.half{border-radius:14px;padding:2px 0;margin:2px 0;border:2px solid transparent}.half+.half{margin-top:10px;border-top:1px dashed var(--line);border-radius:0 0 14px 14px;padding-top:10px}
.line{display:flex;align-items:center;gap:6px;border-radius:14px;padding:2px 6px;border:2px solid transparent}
.num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--cream);color:var(--muted);font-size:.7rem;display:grid;place-items:center}
.ws{flex:1;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 0}
.iw{display:flex;flex-direction:column;align-items:center;text-align:center;padding:5px 7px;border-radius:12px;cursor:pointer;border:2px solid transparent;max-width:128px}
.iw .d{font:700 1.3rem/1.45 "Noto Serif Devanagari",Georgia,serif}
.iw .w{font:italic 600 .95rem Fraunces,Georgia,serif;opacity:.9}
.iw .m{font-size:.78rem;font-style:italic;color:var(--muted);line-height:1.25}
.iw.now{background:color-mix(in srgb,var(--gold) 55%,transparent)}
.iw.sus{box-shadow:inset 0 -2px 0 var(--warn)}
.sel-g{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:var(--gold)!important}
.iw.sel-g{background:color-mix(in srgb,var(--gold) 28%,transparent)}.iw.now.sel-g{background:color-mix(in srgb,var(--gold) 60%,transparent)}
.note{color:var(--muted);font-size:.85rem}
.hint{text-align:center;margin:10px 0 0}
.prog{height:5px;border-radius:5px;background:var(--cream);overflow:hidden;margin-top:12px}.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
details.tr{margin-top:14px;background:var(--cream);border-radius:14px;padding:10px 14px}details.tr summary{cursor:pointer;font-weight:600}details.tr div{margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--paper) 95%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom));text-align:center}
.dock .lbl{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.dock .row{display:flex;align-items:center;justify-content:center;gap:18px}
.big{width:62px;height:62px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:1.4rem;box-shadow:0 6px 18px rgba(42,165,145,.4)}
.pop{position:fixed;left:0;right:0;top:60px;z-index:7;display:none}.pop.open{display:block}
.pop .box{max-width:420px;margin:0 16px 0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.25);display:grid;gap:12px}
.pop label{display:flex;justify-content:space-between;align-items:center;gap:10px}.pop .row{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--cream);border-radius:999px;padding:7px 12px}.pill[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#183b45;font-weight:600}
body.recall .hide-able{filter:blur(8px);cursor:pointer}body.recall .hide-able.show{filter:none}
.empty{text-align:center;color:var(--muted);padding:40px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="top"><div class="wrap">
  <div class="bar1">
    <button class="ic" id="prev" aria-label="Previous verse">‹</button>
    <select id="verse" aria-label="Verse"></select>
    <button class="ic" id="next" aria-label="Next verse">›</button>
    <button class="ic" id="gear" aria-label="Settings">⚙</button>
  </div>
  <div class="seg" id="tiers" role="group" aria-label="What a tap selects"></div>
</div></div>

<main class="wrap">
  <div class="meta"><span class="ref" id="ref"></span>
    <span><button class="chip" id="star" aria-pressed="false">☆ Mark</button> <button class="chip" id="done" aria-pressed="false">✓ Learned</button></span></div>
  <div class="block" id="block"></div>
  <p class="note hint" id="tierNote"></p>
  <details class="tr"><summary>Translation</summary><div id="tr"></div></details>
  <div class="prog"><i id="progBar"></i></div><div class="note" id="markNote" style="margin-top:4px;text-align:center"></div>
</main>

<div class="pop" id="pop"><div class="box">
  <label>Audio <select id="src"></select></label>
  <label>Practice <select id="mode"><option value="listen">Listen</option><option value="repeat">Repeat after me</option></select></label>
  <label>Loop <select id="loop"><option>1</option><option>2</option><option>3</option><option>5</option></select></label>
  <label>Speed <select id="speed"><option value="0.7">0.7×</option><option value="0.85">0.85×</option><option value="1" selected>1×</option></select></label>
  <div class="row">
    <button class="pill" id="tDev" aria-pressed="true">देवनागरी</button>
    <button class="pill" id="tIast" aria-pressed="false">IAST</button>
    <button class="pill" id="mean" aria-pressed="true">Meanings</button>
    <button class="pill" id="recall" aria-pressed="false">Recall mode</button>
  </div>
  <label class="note"><span>Only marked verses</span><input type="checkbox" id="onlyMarked"></label>
  <a href="index.html" class="note">Study &amp; tagging tools →</a>
</div></div>

<div class="dock"><div class="wrap">
  <div class="lbl" id="lbl"></div>
  <div class="row">
    <button class="ic" id="pu" aria-label="Previous">⏮</button>
    <button class="big" id="all" aria-label="Play" aria-pressed="false">▶</button>
    <button class="ic" id="nu" aria-label="Next">⏭</button>
  </div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const SOURCES={tts:{label:'Vāgdhenu chant (TTS)',file:'tts_data.json'},
  mms:{label:'BrajaBeats recording · MMS aligned',file:'aligned_data.json'},
  sushrota:{label:'BrajaBeats recording · Sushrota aligned',file:'sushrota_data.json'},
  hand:{label:'BrajaBeats recording · hand-tagged',file:'data.json'}};
const TIERS=[['verse','Verse'],['hemi','Halves'],['pada','Pādas'],['word','Words']];
const NOTES={verse:'Tap anywhere to hear the whole verse.',hemi:'Tap a word to select its half of the verse.',pada:'Tap a word to select its pāda (quarter-verse).',word:'Tap a word to hear it on its own.'};
const NAME={verse:'Whole verse',hemi:'Half',pada:'Pāda',word:'Word'};
let DB={},V=null,tier='pada',AC=new (window.AudioContext||window.webkitAudioContext)(),BUF=null,bufUrl=null,tok=0,LIST=[],IDX=0;
let UN=[],SELI=0,ALLW=[];   // UN: units at the current granularity; SELI: selected unit
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const on=id=>$(id).getAttribute('aria-pressed')==='true';

/* IAST -> Devanagari (shown as chanted, so a final r/s stays as in the audio) */
const CONS={k:'क',kh:'ख',g:'ग',gh:'घ',ṅ:'ङ',c:'च',ch:'छ',j:'ज',jh:'झ',ñ:'ञ',ṭ:'ट',ṭh:'ठ',ḍ:'ड',ḍh:'ढ',ṇ:'ण',t:'त',th:'थ',d:'द',dh:'ध',n:'न',p:'प',ph:'फ',b:'ब',bh:'भ',m:'म',y:'य',r:'र',l:'ल',v:'व',ś:'श',ṣ:'ष',s:'स',h:'ह'};
const VOW={a:['अ',''],ā:['आ','ा'],i:['इ','ि'],ī:['ई','ी'],u:['उ','ु'],ū:['ऊ','ू'],ṛ:['ऋ','ृ'],ṝ:['ॠ','ॄ'],ḷ:['ऌ','ॢ'],e:['ए','े'],ai:['ऐ','ै'],o:['ओ','ो'],au:['औ','ौ']};
function toDeva(w){w=w.normalize('NFC').toLowerCase();let o='',i=0,prevC=false;
  const peek=()=>{const t=w.substr(i,2);return(CONS[t]||VOW[t])?t:w[i]};
  while(i<w.length){const t=peek();
    if(VOW[t]){o+=prevC?VOW[t][1]:VOW[t][0];prevC=false;i+=t.length;continue}
    if(CONS[t]){if(prevC)o+='्';o+=CONS[t];prevC=true;i+=t.length;
      if(w[i]==='a'&&w[i+1]!=='i'&&w[i+1]!=='u'){prevC=false;i++}continue}
    if(t==='ṁ'||t==='ṃ'){o+='ं';prevC=false}else if(t==='ḥ'){o+='ः';prevC=false}
    else if("’'ʼ".includes(t)){o+='ऽ';prevC=false}
    i++}
  return prevC?o+'्':o}

for(const [k,s] of Object.entries(SOURCES)){const o=document.createElement('option');o.value=k;o.textContent=s.label;$('#src').append(o)}
TIERS.forEach(([k,n])=>{const b=document.createElement('button');b.dataset.t=k;b.textContent=n;b.onclick=()=>{stop();tier=k;SELI=0;draw()};$('#tiers').append(b)});

async function loadSource(k){
  if(!DB[k]){try{DB[k]=await (await fetch(SOURCES[k].file)).json()}catch(e){DB[k]=[]}}
  LIST=DB[k].filter(v=>v.lines&&v.lines.length&&(!$('#onlyMarked').checked||(MK[v.id]||{}).star))
    .sort((a,b)=>(+a.chapter-+b.chapter)||(+a.shloka-+b.shloka));
  const sel=$('#verse');sel.innerHTML='';LIST.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.dataset.id=v.id;sel.append(o)});
  if(!LIST.length){V=null;$('#block').innerHTML='<div class="empty">No verses here yet (or none marked).</div>';return}
  pick(0)}
function pick(i){stop();IDX=Math.max(0,Math.min(LIST.length-1,i));V=LIST[IDX];BUF=null;bufUrl=null;SELI=0;$('#verse').value=IDX;draw()}
$('#src').onchange=e=>loadSource(e.target.value);$('#verse').onchange=e=>pick(+e.target.value);
$('#prev').onclick=()=>pick(IDX-1);$('#next').onclick=()=>pick(IDX+1);

const words=l=>l.chunks.flatMap(c=>c.words);
/* The verse is ALWAYS drawn the same way (halves > pādas > words). The tier only decides what a tap selects. */
function draw(){if(!V)return;
  [...$('#tiers').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tier));
  $('#ref').textContent='Bhagavad-gītā '+V.id;$('#tr').textContent=V.translation;$('#tierNote').textContent=NOTES[tier];
  const L=V.lines,box=$('#block');box.innerHTML='';ALLW=[];
  const sd=on('#tDev'),si=on('#tIast'),sm=on('#mean');
  const mk={verse:[{el:box,span:V.verse_audio}],hemi:[],pada:[],word:[]};
  let wi=0;
  for(let h=0;h*2<L.length;h++){const half=document.createElement('div');half.className='half';
    const hl=L.slice(h*2,h*2+2);
    mk.hemi.push({el:half,span:{start:hl[0].line_audio.start,end:hl[hl.length-1].line_audio.end}});
    hl.forEach((l,k)=>{const li=h*2+k,row=document.createElement('div');row.className='line';
      row.innerHTML='<span class="num"></span><div class="ws"></div>';row.firstChild.textContent=li+1;
      mk.pada.push({el:row,span:l.line_audio});const ws=row.lastChild;
      words(l).forEach(w=>{const e=document.createElement('div');e.className='iw'+(w.suspect?' sus':'');
        e.innerHTML='<span class="d hide-able"></span><span class="w hide-able"></span><span class="m"></span>';
        const [dv,wd,m]=e.children;dv.textContent=toDeva(w.token);wd.textContent=w.token;m.textContent=w.meaning||'';
        dv.hidden=!sd;wd.hidden=!si&&sd;m.hidden=!sm;
        const idx=mk.word.length;mk.word.push({el:e,span:w.word_audio});
        const ref={h,li,idx};
        e.onclick=ev=>{const t=ev.target;
          if(document.body.classList.contains('recall')&&t.classList.contains('hide-able')&&!t.classList.contains('show')){t.classList.add('show');return}
          choose(tier==='verse'?0:tier==='hemi'?ref.h:tier==='pada'?ref.li:ref.idx,true)};
        ALLW.push({w,e});ws.append(e)});
      half.append(row)});box.append(half)}
  UN=mk[tier];UN.forEach(u=>u.el.dataset.u=1);paintSel();paintMarks()}

function paintSel(){document.querySelectorAll('.sel-g').forEach(e=>e.classList.remove('sel-g'));
  const u=UN[SELI];if(!u)return;u.el.classList.add('sel-g');
  $('#lbl').textContent=tier==='verse'?'Whole verse':`${NAME[tier]} ${SELI+1} of ${UN.length}`;
  $('#pu').disabled=SELI<=0;$('#nu').disabled=SELI>=UN.length-1}
function choose(i,play){SELI=Math.max(0,Math.min(UN.length-1,i));paintSel();if(play)playSel()}
$('#pu').onclick=()=>choose(SELI-1,true);$('#nu').onclick=()=>choose(SELI+1,true);

/* ---- ONE player: plays the selection, exactly its audio span, with short fades so cuts don't click ---- */
let srcNode=null,raf=null,T0=0,SP=null,RATE=1;
async function buf(){const u=V.audio;if(bufUrl===u&&BUF)return BUF;
  const url=u.startsWith('braja/')?'../BrajaBeats_Gita_MP3/'+encodeURIComponent(V.source_file||u.slice(6)):u;
  BUF=await AC.decodeAudioData(await (await fetch(url)).arrayBuffer());bufUrl=u;return BUF}
function track(){cancelAnimationFrame(raf);const f=()=>{if(!SP)return;const t=SP.start+(AC.currentTime-T0)*RATE;
  ALLW.forEach(({w,e})=>e.classList.toggle('now',t>=w.word_audio.start&&t<w.word_audio.end));raf=requestAnimationFrame(f)};f()}
function untrack(){SP=null;cancelAnimationFrame(raf);ALLW.forEach(({e})=>e.classList.remove('now'))}
function setPlaying(p){const b=$('#all');b.textContent=p?'■':'▶';b.setAttribute('aria-pressed',p);b.setAttribute('aria-label',p?'Stop':'Play')}
function stop(){tok++;untrack();if(srcNode){try{srcNode.stop()}catch(e){}srcNode=null}setPlaying(false)}
async function playSpan(sp,my){await buf();if(my!==tok)return;if(AC.state==='suspended')await AC.resume();
  const rate=+$('#speed').value;srcNode=AC.createBufferSource();srcNode.buffer=BUF;srcNode.playbackRate.value=rate;
  const g=AC.createGain();srcNode.connect(g);g.connect(AC.destination);
  const s=Math.max(0,sp.start),e=Math.min(BUF.duration,sp.end),t=AC.currentTime,len=(e-s)/rate;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+0.01);g.gain.setValueAtTime(1,Math.max(t+0.01,t+len-0.01));g.gain.linearRampToValueAtTime(0,t+len);
  srcNode.start(t,s,e-s);T0=t;RATE=rate;SP={start:s};track();await sleep(len*1000+30);if(my===tok)untrack()}
async function playSel(){stop();const my=tok,u=UN[SELI];if(!u)return;setPlaying(true);
  const n=+$('#loop').value,rep=$('#mode').value==='repeat';
  for(let k=0;k<n&&my===tok;k++){await playSpan(u.span,my);if(my!==tok)return;
    await sleep(rep?(u.span.end-u.span.start)*1000+500:150)}   // repeat mode: silence as long as the unit, for you to say it
  if(my===tok)setPlaying(false)}
$('#all').onclick=()=>on('#all')?stop():playSel();

/* ---- marks (saved on this device) ---- */
const MK=(()=>{try{return JSON.parse(localStorage.getItem('shlokaMarks')||'{}')}catch(e){return{}}})();
const saveMk=()=>{try{localStorage.setItem('shlokaMarks',JSON.stringify(MK))}catch(e){}};
function paintMarks(){const m=MK[V.id]||{};
  $('#star').textContent=(m.star?'★':'☆')+' Mark';$('#star').classList.toggle('on',!!m.star);$('#star').setAttribute('aria-pressed',!!m.star);
  $('#done').classList.toggle('on',!!m.done);$('#done').setAttribute('aria-pressed',!!m.done);
  const learned=LIST.filter(v=>(MK[v.id]||{}).done).length;$('#progBar').style.width=(100*learned/Math.max(1,LIST.length))+'%';
  $('#markNote').textContent=`${learned} of ${LIST.length} learned`;
  [...$('#verse').options].forEach(o=>{const id=o.dataset.id,x=MK[id]||{};o.textContent=(x.star?'★ ':'')+'BG '+id+(x.done?' ✓':'')});
  $('#prev').disabled=IDX<=0;$('#next').disabled=IDX>=LIST.length-1}
$('#star').onclick=()=>{const m=MK[V.id]=MK[V.id]||{};m.star=!m.star;saveMk();paintMarks()};
$('#done').onclick=()=>{const m=MK[V.id]=MK[V.id]||{};m.done=!m.done;saveMk();paintMarks()};
$('#onlyMarked').onchange=()=>loadSource($('#src').value);

/* ---- settings ---- */
$('#gear').onclick=()=>$('#pop').classList.toggle('open');
document.addEventListener('click',e=>{if(!e.target.closest('#pop,#gear'))$('#pop').classList.remove('open')});
['#tDev','#tIast','#mean'].forEach(id=>$(id).onclick=()=>{$(id).setAttribute('aria-pressed',!on(id));if(!on('#tDev')&&!on('#tIast'))$('#tDev').setAttribute('aria-pressed',true);const k=SELI;draw();SELI=k;paintSel()});
$('#recall').onclick=()=>{const v=!on('#recall');$('#recall').setAttribute('aria-pressed',v);document.body.classList.toggle('recall',v)};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight')choose(SELI+1,true);else if(e.key==='ArrowLeft')choose(SELI-1,true);else if(e.key===' '){e.preventDefault();$('#all').click()}});

const q=new URLSearchParams(location.search);const s0=SOURCES[q.get('src')]?q.get('src'):'tts';$('#src').value=s0;loadSource(s0);
</script></body></html>
