<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn a Shloka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:ital,wght@0,600;1,400&display=swap">
<style>
:root{--paper:#faf8f1;--cream:#f3ecd9;--ink:#183b45;--muted:#61767a;--gold:#f6b73c;--teal:#2aa591;--line:rgba(24,59,69,.14);--shadow:0 6px 20px rgba(3,16,24,.08)}
@media (prefers-color-scheme:dark){:root{--paper:#0d2734;--cream:#163b47;--ink:#f3ecd9;--muted:#9bb2b4;--line:rgba(255,255,255,.17);--teal:#37c7b3}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px 16px 120px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:600 1.35rem Fraunces,Georgia,serif;margin:0}a{color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
select,button{font:inherit;color:var(--ink)}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--cream)}
.pill{border:1px solid var(--line);background:var(--cream);padding:8px 14px;border-radius:999px;cursor:pointer}
.pill[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#183b45;font-weight:600}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiers .pill{border-radius:14px;text-align:center;padding:10px 6px}.tiers small{display:block;font-weight:400;opacity:.75}
.sa{font-size:1.25rem;line-height:1.7;white-space:pre-line;margin:10px 0}
.unit{background:var(--cream);border:2px solid transparent;border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.unit.live{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 26%,var(--cream))}
.unit.sus{border-style:dashed;border-color:#e08a5a}
.unit .play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:1rem;cursor:pointer}
.unit .tx{flex:1;min-width:0}.lab{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iast{font:italic 600 1.1rem Fraunces,Georgia,serif}.mean{color:var(--muted);font-size:.92rem;margin-top:2px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.words .unit{margin:0;display:block}
.words .unit .play{width:36px;height:36px;margin-bottom:6px}
body.recall .hide-able{filter:blur(7px);cursor:pointer;transition:filter .2s}body.recall .hide-able.show{filter:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.bar .pill{padding:8px 12px}.tr{padding:12px 14px;border-left:4px solid var(--teal);background:var(--cream);border-radius:0 12px 12px 0}
.note{color:var(--muted);font-size:.85rem}
</style></head><body><main>
<header><h1>Learn a Shloka</h1><a href="index.html">Study / tagging tools →</a></header>
<div class="row">
  <label>Audio <select id="src"></select></label>
  <label>Verse <select id="verse"></select></label>
</div>
<div class="tiers" id="tiers" role="group" aria-label="Chunk size"></div>
<p class="note" id="tierNote"></p>
<div id="sa" class="sa"></div>
<div id="units"></div>
<div class="tr"><div class="lab">Translation</div><div id="tr"></div></div>
<div class="bar">
  <button class="pill" id="stop">■ Stop</button>
  <button class="pill" id="all">▶ Play all</button>
  <button class="pill" id="drill" title="Plays each unit, then pauses so you can repeat it aloud">🗣 Repeat-after-me</button>
  <label>Loop <select id="loop"><option>1</option><option>2</option><option>3</option><option>5</option></select></label>
  <label>Speed <select id="speed"><option value="0.7">0.7×</option><option value="0.85">0.85×</option><option value="1" selected>1×</option></select></label>
  <button class="pill" id="recall" aria-pressed="false">👁 Recall mode</button>
  <button class="pill" id="mean" aria-pressed="true">Meanings</button>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const SOURCES={tts:{label:'Vāgdhenu chant (TTS)',file:'tts_data.json'},
  mms:{label:'BrajaBeats recording · MMS aligned',file:'aligned_data.json'},
  sushrota:{label:'BrajaBeats recording · Sushrota aligned',file:'sushrota_data.json'},
  hand:{label:'BrajaBeats recording · hand-tagged',file:'data.json'}};
const TIERS=[['verse','Verse','whole shloka'],['hemi','Hemistichs','2 lines'],['pada','Quarter-verses','4 pādas'],['word','Words','one by one']];
const NOTES={verse:'Tier 1 · the full recitation.',hemi:'Tier 2 · each half of the verse, split at the central daṇḍa.',
  pada:'Tier 3 · the four pādas (quarter-verses).',word:'Tier 4 · every word with its meaning. Orange dashed = timing needs checking.'};
let DB={},V=null,tier='pada',AC=new (window.AudioContext||window.webkitAudioContext)(),BUF=null,bufUrl=null,tok=0,cur=null,UN=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

for(const [k,s] of Object.entries(SOURCES)){const o=document.createElement('option');o.value=k;o.textContent=s.label;$('#src').append(o)}
TIERS.forEach(([k,n,sub])=>{const b=document.createElement('button');b.className='pill';b.dataset.t=k;b.innerHTML=`${n}<small>${sub}</small>`;
  b.onclick=()=>{tier=k;draw()};$('#tiers').append(b)});

async function loadSource(k){
  if(!DB[k]){try{DB[k]=await (await fetch(SOURCES[k].file)).json()}catch(e){DB[k]=[]}}
  const list=DB[k].filter(v=>v.lines&&v.lines.length);const sel=$('#verse');sel.innerHTML='';
  list.sort((a,b)=>(+a.chapter-+b.chapter)||(+a.shloka-+b.shloka)).forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent='BG '+v.id;sel.append(o)});
  DB[k+'_list']=list;
  if(!list.length){$('#units').innerHTML='<p class="note">No verses in this source yet.</p>';return}
  pick(0)}
function pick(i){V=DB[$('#src').value+'_list'][i];BUF=null;bufUrl=null;draw()}
$('#src').onchange=e=>loadSource(e.target.value);$('#verse').onchange=e=>pick(+e.target.value);

function words(l){return l.chunks.flatMap(c=>c.words)}
function gloss(ws){return ws.map(w=>w.meaning).filter(Boolean).join(' · ')}
function units(){
  const L=V.lines;
  if(tier==='verse')return[{lab:'Verse',iast:L.map(l=>l.text).join(' / '),span:V.verse_audio,ws:L.flatMap(words),meaning:V.translation}];
  if(tier==='hemi'){const o=[];for(let i=0;i<L.length;i+=2){const g=L.slice(i,i+2);o.push({lab:'Line '+(i/2+1),iast:g.map(l=>l.text).join(' / '),
    span:{start:g[0].line_audio.start,end:g[g.length-1].line_audio.end},ws:g.flatMap(words)})}return o}
  if(tier==='pada')return L.map((l,i)=>({lab:'Pāda '+(i+1),iast:l.text,span:l.line_audio,ws:words(l)}));
  return L.flatMap(l=>words(l)).map(w=>({lab:'',iast:w.token,span:w.word_audio,ws:[w],meaning:w.meaning,sus:w.suspect}))}

function draw(){
  [...$('#tiers').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tier));
  $('#tierNote').textContent=NOTES[tier];$('#sa').textContent=V.sanskrit;$('#sa').classList.add('hide-able');$('#tr').textContent=V.translation;
  UN=units();const box=$('#units');box.innerHTML='';box.className=tier==='word'?'words':'';
  UN.forEach((u,i)=>{const d=document.createElement('div');d.className='unit'+(u.sus?' sus':'');
    d.innerHTML=`<button class="play" aria-label="Play">▶</button><div class="tx"><div class="lab"></div><div class="iast hide-able"></div><div class="mean"></div></div>`;
    d.querySelector('.lab').textContent=u.lab;d.querySelector('.iast').textContent=u.iast;
    d.querySelector('.mean').textContent=u.meaning||gloss(u.ws);d.querySelector('.play').onclick=()=>{stop();playUnit(i,+$('#loop').value)};
    d.querySelector('.iast').onclick=e=>e.target.classList.toggle('show');u.el=d;box.append(d)});
  document.querySelectorAll('.mean').forEach(m=>m.hidden=$('#mean').getAttribute('aria-pressed')!=='true')}
async function buf(){const u=V.audio;if(bufUrl===u&&BUF)return BUF;
  const url=u.startsWith('braja/')?'../BrajaBeats_Gita_MP3/'+encodeURIComponent(V.source_file||u.slice(6)):u;
  BUF=await AC.decodeAudioData(await (await fetch(url)).arrayBuffer());bufUrl=u;return BUF}
let srcNode=null;
function stop(){tok++;if(srcNode){try{srcNode.onended=null;srcNode.stop()}catch(e){}srcNode=null}UN.forEach(u=>u.el.classList.remove('live'))}
async function playSpan(sp,my){await buf();if(my!==tok)return;if(AC.state==='suspended')await AC.resume();
  const rate=+$('#speed').value;srcNode=AC.createBufferSource();srcNode.buffer=BUF;srcNode.playbackRate.value=rate;srcNode.connect(AC.destination);
  const g=AC.createGain();srcNode.disconnect();srcNode.connect(g);g.connect(AC.destination);
  const s=Math.max(0,sp.start),e=Math.min(BUF.duration,sp.end),t=AC.currentTime;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+0.01);g.gain.setValueAtTime(1,t+(e-s)/rate-0.01);g.gain.linearRampToValueAtTime(0,t+(e-s)/rate); // anti-click fades
  srcNode.start(t,s,e-s);await sleep((e-s)/rate*1000+30)}
async function playUnit(i,n=1,pause=0){const my=tok;const u=UN[i];
  for(let k=0;k<n&&my===tok;k++){UN.forEach(x=>x.el.classList.remove('live'));u.el.classList.add('live');u.el.scrollIntoView({block:'nearest',behavior:'smooth'});
    await playSpan(u.span,my);if(my!==tok)return;if(pause)await sleep(pause*(u.span.end-u.span.start)*1000+400);else await sleep(120)}
  if(my===tok)u.el.classList.remove('live')}
$('#stop').onclick=stop;
$('#all').onclick=async()=>{stop();const my=tok;for(let i=0;i<UN.length&&my===tok;i++)await playUnit(i,+$('#loop').value)};
$('#drill').onclick=async()=>{stop();const my=tok;for(let i=0;i<UN.length&&my===tok;i++)await playUnit(i,1,1.0)};  // pause = 1x its length for you to repeat
$('#recall').onclick=e=>{const on=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',on);document.body.classList.toggle('recall',on)};
$('#mean').onclick=e=>{const on=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',on);draw()};
const q=new URLSearchParams(location.search);const s0=SOURCES[q.get('src')]?q.get('src'):'tts';$('#src').value=s0;loadSource(s0);
</script></body></html>
