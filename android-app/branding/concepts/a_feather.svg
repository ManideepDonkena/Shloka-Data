    <linearGradient id="flute" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8862b"/><stop offset=".5" stop-color="#f3c969"/><stop offset="1" stop-color="#b8862b"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="rotate(-28 256 256)">
    <!-- barbs -->
    <g stroke="#58c08f" stroke-width="3" stroke-linecap="round" opacity=".75" fill="none">
      <path d="M256 430 L256 150"/>
      <path d="M256 400 C 225 370, 200 330, 190 280"/><path d="M256 400 C 287 370, 312 330, 322 280"/>
      <path d="M256 370 C 222 340, 196 300, 186 248"/><path d="M256 370 C 290 340, 316 300, 326 248"/>
      <path d="M256 340 C 220 310, 196 268, 190 220"/><path d="M256 340 C 292 310, 316 268, 322 220"/>
