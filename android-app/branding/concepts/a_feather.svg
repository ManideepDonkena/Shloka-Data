    <path d="M256 112 C 316 138, 320 226, 256 268 C 192 226, 196 138, 256 112 Z" fill="#2aa36b"/>
    <path d="M256 134 C 302 156, 304 220, 256 250 C 208 220, 210 156, 256 134 Z" fill="#20b6c9"/>
    <path d="M256 156 C 290 174, 290 214, 256 234 C 222 214, 222 174, 256 156 Z" fill="#1745b0"/>
