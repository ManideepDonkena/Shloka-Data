<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Pāñcajanya in the style of the reference the owner chose: white shell, gold scalloped whorls, flared gold lip. -->
  <defs>
    <radialGradient id="bg" cx="42%" cy="32%" r="85%"><stop offset="0" stop-color="#f39a3a"/><stop offset=".55" stop-color="#d65a20"/><stop offset="1" stop-color="#8f2414"/></radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f7f4ee"/><stop offset="1" stop-color="#e3ddd2"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#e2ddd3"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7dc8e"/><stop offset=".5" stop-color="#e2b04a"/><stop offset="1" stop-color="#b9862a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4a0f06" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="500" cy="500" r="390" fill="none" stroke="#ffd9a0" stroke-opacity=".14" stroke-width="3"/>
  <g transform="translate(500 500) scale(.78) translate(-500 -500)" filter="url(#sh)">
    <!-- body whorl: from the shoulder down to the long siphonal tail at lower left -->
    <path d="M330 268 C 270 300, 222 380, 214 470 C 206 560, 218 650, 200 740 C 186 810, 140 870, 88 922
             C 180 902, 290 880, 380 860 L 640 430 C 600 360, 470 270, 330 268 Z" fill="url(#shell)" stroke="#d8d1c4" stroke-width="4"/>
    <!-- body ribs (gold hairlines) -->
    <g fill="none" stroke="#e2b04a" stroke-width="5" stroke-linecap="round" opacity=".8">
      <path d="M300 330 C 262 420, 252 560, 262 690"/><path d="M340 340 C 300 450, 296 600, 300 720"/>
      <path d="M392 352 C 350 470, 344 620, 336 760"/><path d="M450 370 C 410 490, 398 640, 372 800"/>
      <path d="M252 560 C 246 660, 226 760, 170 860"/>
    </g>
    <!-- spire: four whorls with scalloped gold rims, rising to upper right -->
    <path d="M430 262 C 470 210, 560 190, 640 222 C 700 246, 742 300, 760 360 C 712 392, 640 420, 600 410 C 520 380, 460 320, 430 262 Z" fill="url(#shell)" stroke="#d8d1c4" stroke-width="4"/>
    <path d="M560 168 C 600 140, 660 136, 704 160 C 740 180, 768 220, 778 262 C 740 286, 690 300, 660 292 C 610 270, 576 220, 560 168 Z" fill="url(#shell)" stroke="#d8d1c4" stroke-width="4"/>
    <path d="M652 112 C 680 94, 716 94, 744 112 C 766 128, 782 156, 786 184 C 760 200, 728 206, 708 200 C 676 184, 660 146, 652 112 Z" fill="url(#shell)" stroke="#d8d1c4" stroke-width="4"/>
    <path d="M722 72 C 738 60, 760 62, 774 76 C 784 88, 790 106, 790 124 C 774 132, 756 134, 744 128 C 730 116, 722 92, 722 72 Z" fill="url(#shell)" stroke="#d8d1c4" stroke-width="4"/>
    <path d="M760 30 L 748 74 L 780 78 Z" fill="url(#gold)"/>
    <!-- scalloped gold rims at each suture -->
    <g fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M318 262 q 22 -18 44 -4 q 22 -22 46 -8 q 24 -22 48 -6 q 24 -20 48 -4 q 24 -18 46 0 q 22 -16 44 4 q 20 -10 36 14"/>
      <path d="M440 212 q 22 -20 44 -6 q 22 -22 46 -6 q 22 -20 46 -4 q 22 -16 44 2 q 20 -12 38 10 q 16 -6 30 14"/>
      <path d="M548 156 q 18 -16 36 -4 q 18 -18 38 -4 q 18 -14 36 0 q 18 -12 34 6 q 14 -6 26 12"/>
      <path d="M646 104 q 14 -12 28 -2 q 14 -14 30 -2 q 14 -10 28 4 q 12 -6 22 10"/>
      <path d="M716 66 q 10 -8 22 0 q 12 -8 22 2 q 10 -2 16 10" stroke-width="9"/>
    </g>
    <!-- whorl ribs on the spire -->
    <g fill="none" stroke="#e2b04a" stroke-width="4" stroke-linecap="round" opacity=".75">
      <path d="M520 250 c -6 30 2 60 18 84"/><path d="M570 236 c -4 34 6 66 24 90"/><path d="M630 238 c 0 32 10 62 30 86"/>
      <path d="M630 170 c -2 22 4 44 16 62"/><path d="M680 166 c 0 22 8 44 22 60"/>
    </g>
    <!-- the flared lip (aperture) to the right, gold wavy edge -->
    <path d="M640 430 C 700 410, 790 420, 870 456 C 900 470, 912 500, 900 520 C 924 560, 912 600, 884 610
             C 904 650, 890 690, 858 698 C 862 740, 832 770, 796 766 C 780 800, 740 812, 708 796
             C 660 830, 560 850, 380 860 C 470 760, 560 600, 640 430 Z" fill="url(#inner)" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
    <g fill="none" stroke="#cfc8bb" stroke-width="5" stroke-linecap="round" opacity=".8">
      <path d="M600 560 C 680 540, 770 530, 860 520"/><path d="M570 630 C 660 620, 760 620, 850 640"/><path d="M530 700 C 620 700, 700 710, 780 740"/>
    </g>
    <!-- inner edge of the lip: the thick gold sweep -->
    <path d="M640 430 C 560 600, 470 760, 380 860 C 300 878, 190 900, 88 922" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
  </g>
  <!-- the conch's sound: three rising waves -->
  <g fill="none" stroke="#ffe7b0" stroke-linecap="round" transform="translate(830 250) rotate(-30)">
    <path d="M0 -36 q 34 36 0 72" stroke-width="20"/><path d="M42 -72 q 64 72 0 144" stroke-width="16" opacity=".72"/><path d="M84 -108 q 92 108 0 216" stroke-width="12" opacity=".45"/>
  </g>
</svg>
